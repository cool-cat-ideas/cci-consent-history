services:
  _defaults:
    public: true

  Module\CciConsentHistory\Controller\Admin\ConsentHistoryController:
    autoconfigure: true
    autowire: true

  Module\CciConsentHistory\Grid\Definition\Factory\ConsentAcceptanceGridDefinitionFactory:
    parent: 'prestashop.core.grid.definition.factory.abstract_grid_definition'

  Module\CciConsentHistory\Grid\Query\ConsentAcceptanceQueryBuilder:
    parent: 'prestashop.core.grid.abstract_query_builder'

  cci_consent_history.grid.data_provider.acceptances.doctrine:
    class: '%prestashop.core.grid.data.factory.doctrine_grid_data_factory%'
    arguments:
      - '@Module\CciConsentHistory\Grid\Query\ConsentAcceptanceQueryBuilder'
      - '@prestashop.core.hook.dispatcher'
      - '@prestashop.core.grid.query.doctrine_query_parser'
      - 'cci_consent_acceptances'

  Module\CciConsentHistory\Grid\Data\Factory\ConsentAcceptanceGridDataFactory:
    arguments:
      - '@cci_consent_history.grid.data_provider.acceptances.doctrine'
      - '@translator'

  cci_consent_history.grid.filter_form_factory:
    class: 'PrestaShop\PrestaShop\Core\Grid\Filter\FilterFormFactoryFormActionDecorator'
    arguments:
      - '@prestashop.core.grid.filter.form_factory'
      - '@router'
      - 'cci_consent_history_search'

  cci_consent_history.grid.factory.acceptances:
    class: 'PrestaShop\PrestaShop\Core\Grid\GridFactory'
    arguments:
      - '@Module\CciConsentHistory\Grid\Definition\Factory\ConsentAcceptanceGridDefinitionFactory'
      - '@Module\CciConsentHistory\Grid\Data\Factory\ConsentAcceptanceGridDataFactory'
      - '@cci_consent_history.grid.filter_form_factory'
      - '@prestashop.core.hook.dispatcher'

  Module\CciConsentHistory\Controller\Admin\ImportController:
    autoconfigure: true
    autowire: true

  Module\CciConsentHistory\Command\ImportConsentsCommand:
    autoconfigure: true
    autowire: true
    tags: ['console.command']
